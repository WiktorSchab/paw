App\Entity\Location:
    properties:
        name:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 2, max: 64, groups: [create] }
            - Length: { min: 3, max: 64, groups: [edit] }
        country:
            - Choice: { choices: [PL, DE, FR, ES, IT, GB, US], groups: [create, edit] }
        geo_width:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        geo_lenght:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -180, max: 180, groups: [create, edit] }

App\Entity\Forecast:
    properties:
        location:
            - NotNull: { groups: [create, edit] }
        date:
            - NotBlank: { groups: [create, edit] }
        temp_celc:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -60, max: 60, groups: [create] }
            - Range: { min: -50, max: 50, groups: [edit] }
        humidity:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 99, groups: [create, edit] }
        wind_speed:
            - NotBlank: { groups: [create] }
            - PositiveOrZero: { groups: [create, edit] }
            - LessThanOrEqual: { value: 400, groups: [create, edit] }
        precipitation:
            - NotBlank: { groups: [create] }
            - PositiveOrZero: { groups: [create, edit] }
